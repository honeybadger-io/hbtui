[package]
name = "hbtui"
version = "0.0.1"
edition = "2021"
description = "Terminal dashboard for Honeybadger.io"
license = "MIT"
repository = "https://github.com/honeybadger-io/hbtui"
homepage = "https://www.honeybadger.io"
keywords = ["honeybadger", "tui", "dashboard", "monitoring"]
categories = ["command-line-utilities", "visualization"]
readme = "README.md"
authors = ["Honeybadger Industries LLC"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
serde_yml = "0.0.12"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
